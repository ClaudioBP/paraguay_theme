name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Verify shell script syntax
        run: |
          bash -n instalar.sh
          bash -n desinstalar.sh
          bash -n scripts/banco_plymouth.sh
          bash -n scripts/probar_instalador.sh
          bash -n scripts/verificar_instalacion.sh

      - name: Check theme assets reproducibility
        run: |
          python scripts/generar_tema.py --comprobar

      - name: Validate flag dot matrix
        run: |
          python scripts/render_mapa_puntos.py --validar
